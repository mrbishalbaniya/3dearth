apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-api
  labels:
    app: orbit-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orbit-api
  template:
    metadata:
      labels:
        app: orbit-api
    spec:
      containers:
        - name: api
          image: orbit-earth-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orbit-api-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-api
spec:
  selector:
    app: orbit-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
